name: Build & Release 3X-UI Chitanda

on:
  push:
    branches:
      - 3x-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "amd64"
            arch_name: "amd64"
            xray_pkg: "64"
            cc: "gcc"
          - platform: "arm64"
            arch_name: "arm64"
            xray_pkg: "arm64-v8a"
            cc: "aarch64-linux-gnu-gcc"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.platform }}" == "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          else
            sudo apt-get install -y gcc
          fi

      - name: Build 3X-UI Binary
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          export CC=${{ matrix.cc }}
          
          go build -ldflags="-s -w" -o xui-release .
          
          mkdir -p x-ui/bin
          cp xui-release x-ui/x-ui
          cp -r web x-ui/
          cp x-ui.service x-ui/
          cp x-ui.sh x-ui/
          
          # Download Chitanda Xray-core
          curl -fL -o x-ui/bin/xray.zip https://github.com/chitanda-project/chitanda/releases/download/v26.3.27/Xray-linux-${{ matrix.xray_pkg }}.zip || curl -fL -o x-ui/bin/xray.zip https://github.com/violetaini/chitanda/releases/download/v26.3.27/Xray-linux-${{ matrix.xray_pkg }}.zip
          unzip -o x-ui/bin/xray.zip -d x-ui/bin/
          rm -f x-ui/bin/xray.zip
          mv x-ui/bin/xray x-ui/bin/xray-linux-${{ matrix.arch_name }}
          chmod +x x-ui/bin/xray-linux-${{ matrix.arch_name }}
          
          # Download GeoIP & GeoSite dat files (standard + localization)
          curl -fL -o x-ui/bin/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fL -o x-ui/bin/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -fL -o x-ui/bin/geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          curl -fL -o x-ui/bin/geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          curl -fL -o x-ui/bin/geoip_VN.dat https://github.com/vuong2023/vn-v2ray-rules/releases/latest/download/geoip.dat
          curl -fL -o x-ui/bin/geosite_VN.dat https://github.com/vuong2023/vn-v2ray-rules/releases/latest/download/geosite.dat
          
          tar -czvf "x-ui-linux-${{ matrix.arch_name }}.tar.gz" x-ui
          mkdir -p dist
          mv "x-ui-linux-${{ matrix.arch_name }}.tar.gz" dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.arch_name }}
          path: dist/*
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_dist
          merge-multiple: true

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "3x-ui-v2.3.11"
          name: "3X-UI v2.3.11 (Native Chitanda Protocol Support)"
          body: |
            Customized **3X-UI v2.3.11** with native visual UI support for **Chitanda Protocol** (`h2`, `stream`, `h3`, `auto`, `h1`).
            
            ### Features:
            - **Visual Chitanda Inbound Form**: Add/Edit Inbound $\to$ Select `chitanda` directly in Protocol dropdown.
            - **One-Click PSK Generator**: 32-byte secure pre-shared key generator.
            - **Transport Modes**: `h2` (TLS 1.3), `stream` (RawStream 专线高性能), `h3`, `auto`, `h1` (免证书直连).
            - **Security Controls**: Bind `server_id` anti-replay and optional persistent `replay_file`.
            - **Native Node Subscription**: Export Chitanda node links & configs.
            - **Bundled Core**: Pre-packaged with `xray-chitanda` multi-arch core.
          files: |
            all_dist/*
          draft: false
          prerelease: false
          make_latest: false
          clobber: true
