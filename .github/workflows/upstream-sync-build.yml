name: Upstream Sync & Automated Release

on:
  push:
    branches: [ main ]
    paths:
      - 'integration/**'
      - 'pkg/**'
      - 'internal/**'
      - 'scripts/**'
      - 'go.mod'
      - '.github/workflows/upstream-sync-build.yml'
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and overwrite existing release assets'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  cleanup-legacy:
    # A code push/hotfix must not delete existing rollback releases.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy and draft release objects
        run: |
          echo "Scanning all releases including drafts for legacy items..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases | jq -c '.[]' | while read -r rel; do
            rel_id=$(echo "$rel" | jq -r '.id')
            tag_name=$(echo "$rel" | jq -r '.tag_name // ""')
            rel_name=$(echo "$rel" | jq -r '.name // ""')
            if [[ "$tag_name" == *"xray-chitanda"* || "$tag_name" == *"mihomo-chitanda"* || "$rel_name" == *"xray-chitanda"* || "$rel_name" == *"mihomo-chitanda"* ]]; then
              echo ">>> Deleting legacy release ID $rel_id ($tag_name / $rel_name)..."
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/$rel_id"
            fi
          done

  check-and-build:
    needs: cleanup-legacy
    if: ${{ !cancelled() && needs.cleanup-legacy.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "mihomo"
            repo: "MetaCubeX/mihomo"
            pkg_path: "."
          - target: "xray"
            repo: "XTLS/Xray-core"
            pkg_path: "./main"

    steps:
      - name: Checkout Chitanda Core Repository
        uses: actions/checkout@v4

      - name: Set up Go (Stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Latest Upstream Tag
        id: upstream_check
        run: |
          LATEST_TAG=$(curl -fsSL --retry 3 --retry-all-errors \
            https://api.github.com/repos/${{ matrix.repo }}/releases/latest 2>/dev/null \
            | jq -r 'if type == "object" then (.tag_name // empty) else empty end' 2>/dev/null \
            || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git ls-remote --tags --refs https://github.com/${{ matrix.repo }}.git \
              | awk -F/ '{print $3}' \
              | sort -V \
              | tail -n 1)
          fi
          test -n "$LATEST_TAG"
          echo "Latest ${{ matrix.target }} Tag: $LATEST_TAG"
          echo "upstream_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Check if this release tag already exists in our repo
          RELEASE_EXISTS=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/$LATEST_TAG 2>/dev/null \
            | jq -r 'if type == "object" then (.id // empty) else empty end' 2>/dev/null \
            || true)
          
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.force_build }}" == "true" ] || [ -z "$RELEASE_EXISTS" ]; then
            echo "Triggering build for $LATEST_TAG (Event: ${{ github.event_name }}, Force: ${{ inputs.force_build }})..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Release $LATEST_TAG already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone Upstream Source
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          git clone --depth 1 --branch ${{ steps.upstream_check.outputs.upstream_tag }} https://github.com/${{ matrix.repo }}.git upstream_src

      - name: Inject Chitanda Protocol Adapter
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          if [ "${{ matrix.target }}" == "mihomo" ]; then
            python3 scripts/inject-mihomo.py upstream_src $PWD
          else
            python3 scripts/inject-xray.py upstream_src $PWD
          fi

      - name: Test Xray Chitanda adapter regressions
        if: steps.upstream_check.outputs.should_build == 'true' && matrix.target == 'xray'
        run: |
          cd upstream_src
          go mod tidy
          go test -race ./proxy/chitanda -count=1 -timeout 120s

      - name: Build Multi-Architecture Binaries
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          cd upstream_src
          go mod tidy || true
          python3 "$GITHUB_WORKSPACE/scripts/patch_xnet.py"
          mkdir -p ../dist
          
          TAG="${{ steps.upstream_check.outputs.upstream_tag }}"
          
          # Xray preserves its existing ecosystem matrix. Mihomo additionally
          # publishes every sidecar target required by Clash Verge Rev.
          if [ "${{ matrix.target }}" == "mihomo" ]; then
            PLATFORMS=(
              "linux/amd64" "linux/386" "linux/arm" "linux/arm64"
              "linux/riscv64" "linux/loong64"
              "windows/amd64" "windows/386" "windows/arm64"
              "darwin/amd64" "darwin/arm64"
            )
          else
            PLATFORMS=("linux/amd64" "linux/arm64" "windows/amd64" "darwin/arm64" "darwin/amd64")
          fi
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            GOARM_VALUE=""
            ASSET_ARCH="$GOARCH"
            if [ "$GOARCH" == "arm" ]; then
              GOARM_VALUE="7"
              ASSET_ARCH="armv7"
            fi
            EXT=""
            if [ "$GOOS" == "windows" ]; then EXT=".exe"; fi
            
            BIN_NAME="${{ matrix.target }}${EXT}"
            echo "Building $BIN_NAME for $GOOS/$GOARCH..."
            
            BUILD_FLAGS=""
            LDFLAGS="-s -w -buildid="
            if [ "${{ matrix.target }}" == "mihomo" ]; then
              BUILD_FLAGS="-tags with_gvisor"
              LDFLAGS="-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=${TAG}"
            fi
            
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM_VALUE go build $BUILD_FLAGS -trimpath -ldflags="$LDFLAGS" -o "../dist/$BIN_NAME" ${{ matrix.pkg_path }}
            
            if [ "$GOOS" == "linux" ] && [ "$GOARCH" == "amd64" ] && [ "${{ matrix.target }}" == "mihomo" ]; then
              echo "===> Running Mihomo smoke test with Chitanda configurations..."
              "../dist/$BIN_NAME" -t -f "$GITHUB_WORKSPACE/examples/mihomo/config.yaml"
              printf 'mixed-port: 7890\nproxies:\n  - {name: test-minimal, server: 127.0.0.1, port: 443, type: chitanda, psk: test-secret-token}\n' > /tmp/test-minimal.yaml
              "../dist/$BIN_NAME" -t -f /tmp/test-minimal.yaml
              rm -f /tmp/test-minimal.yaml
              echo "===> Mihomo smoke test PASSED successfully!"
            fi
            
            cd ../dist
            
            if [ "${{ matrix.target }}" == "xray" ]; then
              # Standard upstream Xray naming rules:
              # Xray-linux-64.zip, Xray-linux-arm64-v8a.zip, Xray-windows-64.zip, Xray-macos-arm64-v8a.zip, Xray-macos-64.zip
              XRAY_ARCH="$GOARCH"
              XRAY_OS="$GOOS"
              if [ "$GOARCH" == "amd64" ]; then XRAY_ARCH="64"; fi
              if [ "$GOARCH" == "arm64" ]; then XRAY_ARCH="arm64-v8a"; fi
              if [ "$GOOS" == "darwin" ]; then
                XRAY_OS="macos"
                if [ "$GOARCH" == "amd64" ]; then XRAY_ARCH="64"; fi
                if [ "$GOARCH" == "arm64" ]; then XRAY_ARCH="arm64-v8a"; fi
              fi
              
              # Ensure GeoIP & GeoSite dat files are included in standard Xray zip distribution
              if [ ! -f "geoip.dat" ]; then
                curl -fsSL -o "geoip.dat" https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
              fi
              if [ ! -f "geosite.dat" ]; then
                curl -fsSL -o "geosite.dat" https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
              fi
              
              STD_ZIP="Xray-${XRAY_OS}-${XRAY_ARCH}.zip"
              zip "$STD_ZIP" "xray${EXT}" "geoip.dat" "geosite.dat"
              rm -f "xray${EXT}"
              
              # Standard .dgst checksum file (SHA256)
              SHA256_VAL=$(sha256sum "$STD_ZIP" | awk '{print $1}')
              echo "SHA256(${STD_ZIP})= ${SHA256_VAL}" > "${STD_ZIP}.dgst"
            elif [ "${{ matrix.target }}" == "mihomo" ]; then
              # Standard upstream Mihomo naming rules:
              # mihomo-linux-amd64-v1.19.30.gz, mihomo-linux-armv7-v1.19.30.gz,
              # mihomo-windows-amd64-v1.19.30.zip, etc.
              if [ "$GOOS" == "windows" ]; then
                zip "mihomo-${GOOS}-${ASSET_ARCH}-${TAG}.zip" "mihomo.exe"
                rm -f "mihomo.exe"
              else
                gzip -c "$BIN_NAME" > "mihomo-${GOOS}-${ASSET_ARCH}-${TAG}.gz"
                rm -f "$BIN_NAME"
              fi
            fi
            
            cd ../upstream_src
          done

          if [ "${{ matrix.target }}" == "mihomo" ]; then
            # OpenClash selects a core by these OpenWrt-specific architecture
            # labels and expects a tar.gz containing an executable named
            # `clash`. Build this channel separately from desktop sidecars.
            OPENCLASH_TARGETS=(
              "linux-amd64-v1|amd64||"
              "linux-arm64|arm64||"
              "linux-armv7|arm|7|"
              "linux-armv6|arm|6|"
              "linux-armv5|arm|5|"
              "linux-386|386||"
              "linux-mips64le|mips64le||"
              "linux-mips64|mips64||"
              "linux-mips-softfloat|mips||softfloat"
              "linux-mipsle-softfloat|mipsle||softfloat"
              "linux-riscv64|riscv64||"
              "linux-loong64-abi2|loong64||"
            )
            for TARGET in "${OPENCLASH_TARGETS[@]}"; do
              IFS='|' read -r OPENCLASH_ARCH GOARCH_VALUE GOARM_VALUE GOMIPS_VALUE <<< "$TARGET"
              echo "Building OpenClash core for $OPENCLASH_ARCH..."
              CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH_VALUE GOARM=$GOARM_VALUE GOMIPS=$GOMIPS_VALUE \
                go build -tags with_gvisor -trimpath -ldflags="$LDFLAGS" -o ../dist/clash .
              mkdir -p ../dist/openclash-stage
              mv ../dist/clash ../dist/openclash-stage/clash
              tar -C ../dist/openclash-stage -czf "../dist/clash-${OPENCLASH_ARCH}.tar.gz" clash
              rm -f ../dist/openclash-stage/clash
            done
            rmdir ../dist/openclash-stage
          fi
          
          # Generate consolidated SHA256 checksums
          cd ../dist
          if [ "${{ matrix.target }}" == "mihomo" ]; then
            python3 - "$TAG" "$GITHUB_WORKSPACE/releases/mihomo/release-contract.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          tag, contract_path = sys.argv[1:]
          contract = json.loads(Path(contract_path).read_text(encoding="utf-8"))
          assets = {}
          for target, pattern in contract["desktopAssets"].items():
              name = pattern.format(upstreamTag=tag)
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"missing required desktop asset: {target} -> {name}")
              assets[target] = {
                  "name": name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          openclash_assets = {}
          for target, name in contract["openClashAssets"]["assets"].items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"missing required OpenClash asset: {target} -> {name}")
              openclash_assets[target] = {
                  "name": name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          Path("version.txt").write_text(tag + "\n", encoding="utf-8")
          Path("manifest.json").write_text(
              json.dumps(
                  {
                      "schema": contract["schema"],
                      "upstreamTag": tag,
                      "assets": assets,
                      "openClashAssets": openclash_assets,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          sha256sum * > sha256sums.txt

      - name: Publish GitHub Release
        if: steps.upstream_check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.upstream_check.outputs.upstream_tag }}"
          name: "${{ matrix.target }} ${{ steps.upstream_check.outputs.upstream_tag }}"
          body: |
            Automated release of **${{ matrix.repo }}** `${{ steps.upstream_check.outputs.upstream_tag }}` with native **Chitanda Protocol** integrated.
            
            ### Package Standard:
            - **Strict Ecosystem Alignment**: Identical naming rules to official upstream releases.
            - **gVisor TUN Support**: Compiled with `-tags with_gvisor` for full Clash Verge / Mihomo Party TUN compatibility.
            - **Checksum Sidecars**: `.dgst` sidecars and `sha256sums.txt` included.
            - **Commit**: `${{ github.sha }}`
          files: |
            dist/*
          draft: false
          prerelease: false
          make_latest: false
          clobber: true

      - name: Update Mihomo version.txt in main branch
        if: steps.upstream_check.outputs.should_build == 'true' && matrix.target == 'mihomo'
        run: |
          mkdir -p releases/mihomo
          echo "${{ steps.upstream_check.outputs.upstream_tag }}" > releases/mihomo/version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/mihomo/version.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): update Mihomo latest version to ${{ steps.upstream_check.outputs.upstream_tag }}" && git push origin main)

      - name: Trigger Downstream CMFA Build
        if: steps.upstream_check.outputs.should_build == 'true' && matrix.target == 'mihomo'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            echo "Triggering chitanda-cmfa build via repository_dispatch..."
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository_owner }}/chitanda-cmfa/dispatches" \
              -d '{"event_type":"chitanda-core-updated","client_payload":{"upstream_tag":"${{ steps.upstream_check.outputs.upstream_tag }}","commit":"${{ github.sha }}"}}'
            echo "Dispatched event to chitanda-cmfa."
          else
            echo "Notice: DISPATCH_TOKEN secret is not configured in this repo. CMFA will auto-sync via its watch workflow."
          fi
