name: Build Xray Core

on:
  push:
    branches: [ main ]
    paths:
      - 'integration/xray/**'
      - 'integration/xray_udp_hub/**'
      - 'scripts/inject-xray.py'
      - 'scripts/test_inject_xray.py'
      - 'scripts/prepare-xray-quic-vendor.sh'
      - 'scripts/patch-vendor.go'
      - 'scripts/patch-receive.go'
      - 'scripts/vendor-performance.patch'
      - 'scripts/release-provenance.py'
      - 'scripts/vendor-tests/**'
      - 'pkg/**'
      - 'internal/**'
      - 'go.mod'
      - '.github/workflows/build-xray.yml'
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and overwrite existing release assets'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=http2legacy
      CHITANDA_REQUIRE_H2_PADDING: "1"
    steps:
      - name: Checkout Chitanda Core Repository
        uses: actions/checkout@v4

      - name: Set up Go (Stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Latest Upstream Tag
        id: upstream_check
        run: |
          LATEST_TAG=$(curl -fsSL --retry 3 --retry-all-errors \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest 2>/dev/null \
            | jq -r 'if type == "object" then (.tag_name // empty) else empty end' 2>/dev/null \
            || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git ls-remote --tags --refs https://github.com/XTLS/Xray-core.git \
              | awk -F/ '{print $3}' \
              | sort -V \
              | tail -n 1)
          fi
          test -n "$LATEST_TAG"
          echo "Latest Xray Tag: $LATEST_TAG"
          echo "upstream_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Check if this release tag already exists in our repo
          RELEASE_EXISTS=$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/$LATEST_TAG 2>/dev/null \
            | jq -r 'if type == "object" then (.id // empty) else empty end' 2>/dev/null \
            || true)
          
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.force_build }}" == "true" ] || [ -z "$RELEASE_EXISTS" ]; then
            echo "Triggering build for $LATEST_TAG (Event: ${{ github.event_name }}, Force: ${{ inputs.force_build }})..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Release $LATEST_TAG already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone Upstream Source
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          git clone --depth 1 --branch ${{ steps.upstream_check.outputs.upstream_tag }} https://github.com/XTLS/Xray-core.git upstream_src

      - name: Test Xray injector invariants
        if: steps.upstream_check.outputs.should_build == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Inject Chitanda Protocol Adapter
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          python3 scripts/inject-xray.py upstream_src $PWD

      - name: Prepare Xray root vendor patches
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          cd upstream_src
          sh "$GITHUB_WORKSPACE/scripts/prepare-xray-quic-vendor.sh" "$GITHUB_WORKSPACE"

      - name: Test Xray Chitanda adapter regressions
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          cd upstream_src
          go test -mod=vendor -race ./proxy/chitanda -count=1 -timeout 180s
          go test -mod=vendor -race ./infra/conf -run Chitanda -count=1 -timeout 120s
          go test -mod=vendor -race ./transport/internet/udp -run Chitanda -count=1 -timeout 120s
          # go mod vendor omits dependency tests. Restore SDK tests explicitly
          # so this gate cannot silently succeed with "[no test files]".
          cp "$GITHUB_WORKSPACE"/pkg/client/*_test.go vendor/github.com/violetaini/chitanda/pkg/client/
          cp "$GITHUB_WORKSPACE"/pkg/connio/*_test.go vendor/github.com/violetaini/chitanda/pkg/connio/
          cp "$GITHUB_WORKSPACE"/pkg/server/stream_admission_test.go vendor/github.com/violetaini/chitanda/pkg/server/
          go test -mod=vendor -race github.com/violetaini/chitanda/pkg/connio -run WriterShutdown -count=30 -timeout=120s
          go test -mod=vendor -race github.com/violetaini/chitanda/pkg/server -run StreamAdmission -count=30 -timeout=120s
          go test -mod=vendor -race github.com/violetaini/chitanda/pkg/client -run 'H3CarrierLifecycle|H3PacketLifecycle|RegressionOctober15ClientCloseWakesH3UDPRead' -count=30 -timeout=120s

      - name: Test Chitanda SDK regressions
        if: steps.upstream_check.outputs.should_build == 'true'
        env:
          # This SDK module test uses stock module dependencies. The adapter
          # wire test above enforces padding in the actual release vendor.
          CHITANDA_REQUIRE_H2_PADDING: "0"
        run: |
          GOFLAGS= go test -mod=mod -race ./internal/... ./pkg/... -count=1 -timeout 180s
          go test -mod=mod -race ./internal/... ./pkg/... -count=1 -timeout 180s

      - name: Build Multi-Architecture Binaries
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          cd upstream_src
          mkdir -p ../dist
          
          PLATFORMS=("linux/amd64" "linux/arm64" "windows/amd64" "darwin/arm64" "darwin/amd64")
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            EXT=""
            if [ "$GOOS" == "windows" ]; then EXT=".exe"; fi
            
            BIN_NAME="xray${EXT}"
            echo "Building $BIN_NAME for $GOOS/$GOARCH..."
            
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -mod=vendor -trimpath -ldflags="-s -w -buildid=" -o "../dist/$BIN_NAME" ./main
            
            cd ../dist
            
            # Standard upstream Xray naming rules:
            # Xray-linux-64.zip, Xray-linux-arm64-v8a.zip, Xray-windows-64.zip, Xray-macos-arm64-v8a.zip, Xray-macos-64.zip
            XRAY_ARCH="$GOARCH"
            XRAY_OS="$GOOS"
            if [ "$GOARCH" == "amd64" ]; then XRAY_ARCH="64"; fi
            if [ "$GOARCH" == "arm64" ]; then XRAY_ARCH="arm64-v8a"; fi
            if [ "$GOOS" == "darwin" ]; then
              XRAY_OS="macos"
              if [ "$GOARCH" == "amd64" ]; then XRAY_ARCH="64"; fi
              if [ "$GOARCH" == "arm64" ]; then XRAY_ARCH="arm64-v8a"; fi
            fi
            
            # Ensure GeoIP & GeoSite dat files are included in standard Xray zip distribution
            if [ ! -f "geoip.dat" ]; then
              curl -fsSL -o "geoip.dat" https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
            fi
            if [ ! -f "geosite.dat" ]; then
              curl -fsSL -o "geosite.dat" https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
            fi
            
            STD_ZIP="Xray-${XRAY_OS}-${XRAY_ARCH}.zip"
            zip "$STD_ZIP" "xray${EXT}" "geoip.dat" "geosite.dat"
            rm -f "xray${EXT}"
            
            # Standard .dgst checksum file (SHA256)
            SHA256_VAL=$(sha256sum "$STD_ZIP" | awk '{print $1}')
            echo "SHA256(${STD_ZIP})= ${SHA256_VAL}" > "${STD_ZIP}.dgst"
            
            cd ../upstream_src
          done
          
          cd ../dist
          python3 "$GITHUB_WORKSPACE/scripts/release-provenance.py" "$PWD" "$GITHUB_SHA"
          sha256sum * > sha256sums.txt

      - name: Publish GitHub Release
        if: steps.upstream_check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.upstream_check.outputs.upstream_tag }}"
          name: "xray ${{ steps.upstream_check.outputs.upstream_tag }}"
          body: |
            Automated release of **XTLS/Xray-core** `${{ steps.upstream_check.outputs.upstream_tag }}` with native **Chitanda Protocol** integrated.

            ### 更新范围（2026-10-15 边界与接入修复）
            - **链式载体补修**：保留 H3 物理拨号上下文至载体关闭，修复 proxySettings 下的 H3 TCP 和 h2/h3/auto UDP；五模式真实链式/多流与生命周期回归。[第四轮验收](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/REPAIR_ACCEPTANCE_2026-10-15_R4.md)。
            - **H3 UDP 补修**：显式绑定关联与 QUIC/manager 关闭生命周期，修复原版依赖下关闭后读取不退出；原版与 patched race 分别验收。[补修记录](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/REPAIR_ACCEPTANCE_2026-10-15_R3.md)。
            - **第二轮补充**：关闭 stream/H1 活动 TCP/UDP 和待决建连；处理并释放 EOF/错误同次返回的末批 UDP；修复短域名小报文解析。[第二轮验收](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/REPAIR_ACCEPTANCE_2026-10-15_R2.md)。
            - Xray 修复 UDP 批量写 deadline/关闭入口与 TCP 读缓冲复用；内嵌 SDK 修复 H1 超时解析、响应头预算和 Plain-UDP 时钟回拨误丢。
            - Go 1.27 H2 显式设置 64MiB 接收窗口；发布选择经线级 SETTINGS/DATA padding 验证的 patched `http2legacy` 路径。
            - 相对 2026-10-14 版本无协议格式或密钥派生变化，可分步更新客户端/服务端；只更新一端不包含另一端修复。`build-info.json` 提供源码提交及归档/原始内核 SHA256。
            - [验收与限制](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/REPAIR_ACCEPTANCE_2026-10-15.md)。自动发布不等于生产部署，也不是公网吞吐或零丢包保证。
            
            ### Package Standard:
            - **Strict Ecosystem Alignment**: Identical naming rules to official upstream releases.
            - **Bundled Assets**: `geoip.dat` and `geosite.dat` included.
            - **Checksum Sidecars**: `.dgst` sidecars and `sha256sums.txt` included.
            - **Commit**: `${{ github.sha }}`
          files: |
            dist/*
          draft: false
          prerelease: false
          make_latest: false
          clobber: true
