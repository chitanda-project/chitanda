syntax = "proto3";

package xray.proxy.chitanda;
option csharp_namespace = "Xray.Proxy.Chitanda";
option go_package = "github.com/xtls/xray-core/proxy/chitanda";
option java_package = "com.xray.proxy.chitanda";
option java_multiple_files = true;

message User {
  string email = 1;
  string psk = 2;
  uint32 level = 3;
}

message InboundConfig {
  string psk = 1;
  string path = 2;
  string fallback = 3;
  string strict_sni = 4;
  string transport = 5;
  string server_id = 6;
  string replay_file = 7;
  string cert_file = 8;
  string key_file = 9;
  repeated User users = 10;
}

message OutboundConfig {
  string server = 1;
  string server_name = 2;
  string psk = 3;
  string path = 4;
  string transport = 5;
  int32 pool_size = 6;
  string server_id = 7;
  bool allow_insecure = 8;
  bool auto_scale = 9;
  int32 max_pool_size = 10;
  int32 scale_up_threshold = 11;
  int32 scale_down_idle = 12;
  int32 cooldown = 13;
}

