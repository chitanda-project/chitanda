# Mihomo (Clash.Meta) - Chitanda 全トランスポートモード設定ファイル例
port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

proxies:
  # -------------------------------------------------------------
  # モード 1: H2 ストリーム多重化モード (TLS 1.3 + HTTP/2 多重化) - デフォルト推奨
  # -------------------------------------------------------------
  - name: "Chitanda-01-H2-Tokyo"
    type: chitanda
    server: jp.example.com
    port: 443
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/api/v1/sync"
    transport: "h2"
    sni: "jp.example.com"
    pool-size: 4
    udp: true

  # -------------------------------------------------------------
  # モード 2: H3 ネイティブ QUIC モード (HTTP/3 0-RTT + Head-of-Line ブロッキングなし)
  # -------------------------------------------------------------
  - name: "Chitanda-02-H3-Tokyo"
    type: chitanda
    server: jp.example.com
    port: 443
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/api/v1/sync"
    transport: "h3"
    sni: "jp.example.com"
    udp: true

  # -------------------------------------------------------------
  # モード 3: Auto インテリジェント自己治癒モード (H2 主線 + 障害時 H3 へフォールバック)
  # -------------------------------------------------------------
  - name: "Chitanda-03-Auto-Tokyo"
    type: chitanda
    server: jp.example.com
    port: 443
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/api/v1/sync"
    transport: "auto"
    sni: "jp.example.com"
    pool-size: 4
    udp: true

  # -------------------------------------------------------------
  # モード 4: H1 IP 直指定・証明書不要実験モード (全二重 HTTP/1.1 AEAD + Plain-UDP)
  # -------------------------------------------------------------
  - name: "Chitanda-04-H1-DirectIP"
    type: chitanda
    server: 203.0.113.88
    port: 18200
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/gateway/stream/v2"
    transport: "h1"
    udp: true

  # -------------------------------------------------------------
  # モード 5: Stream 専用線高スループットモード (RawStream TCP + AES-128-GCM + 動的難読化) - 専用線推奨
  # -------------------------------------------------------------
  - name: "Chitanda-05-Stream-Tokyo"
    type: chitanda
    server: 203.0.113.88
    port: 11323
    psk: "super-secure-pre-shared-key-sample-token"
    transport: "stream"
    server-id: "tokyo-node-01"
    udp: true

  # -------------------------------------------------------------
  # 特殊構成例: 軟ルーター・透明ゲートウェイ向け最適化構成 (TPROXY / TUN 多端末高並行)
  # -------------------------------------------------------------
  # 多数の端末（10〜50台）が常時接続する軟ルーター環境（x86 N100/N5105 等）向け推奨。
  # pool-size で TCP 物理多重化コネクションを 8 本に拡張し、udp-pool-size を 4 本に設定して
  # 大容量ダウンロードによるゲーム・DNS・音声パケットの押し出し（バッファブロート）を物理分離・防止します。
  - name: "Chitanda-06-Gateway-Tokyo"
    type: chitanda
    server: jp.example.com
    port: 443
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/api/v1/sync"
    transport: "h2"
    sni: "jp.example.com"
    pool-size: 8          # TCP 物理多重化コネクション数（軟ルーター推奨: 6〜8、最大: 16）
    udp-pool-size: 4      # UDP (H3) 物理多重化コネクション数（推奨: 4、最大: 16）
    udp: true

proxy-groups:
  - name: "PROXIES"
    type: select
    proxies:
      - "AUTO-FALLBACK"
      - "Chitanda-01-H2-Tokyo"
      - "Chitanda-02-H3-Tokyo"
      - "Chitanda-03-Auto-Tokyo"
      - "Chitanda-04-H1-DirectIP"
      - "Chitanda-05-Stream-Tokyo"
      - "Chitanda-06-Gateway-Tokyo"
      - DIRECT

  - name: "AUTO-FALLBACK"
    type: fallback
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Chitanda-01-H2-Tokyo"
      - "Chitanda-02-H3-Tokyo"
      - "Chitanda-03-Auto-Tokyo"
      - "Chitanda-04-H1-DirectIP"
      - "Chitanda-05-Stream-Tokyo"
      - "Chitanda-06-Gateway-Tokyo"

  - name: "LOAD-BALANCE"
    type: load-balance
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Chitanda-01-H2-Tokyo"
      - "Chitanda-02-H3-Tokyo"
      - "Chitanda-03-Auto-Tokyo"
      - "Chitanda-05-Stream-Tokyo"
      - "Chitanda-06-Gateway-Tokyo"

rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXIES
